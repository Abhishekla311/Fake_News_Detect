<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake News Detector</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container-card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            max-width: 650px;
            width: 100%;
        }
        .btn-custom {
            background-color: #0d6efd;
            border: none;
            padding: 12px;
            font-weight: 500;
        }
        .alert-box {
            margin-top: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            text-align: center;
            padding: 15px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container-card">
    <h3 class="text-center mb-4">📰 Fake News Detection System</h3>
    
    <form action="/predict" method="post">
        <div class="mb-3">
            <label for="Input_data" class="form-label fw-semibold">Enter News Content/Article:</label>
            <textarea 
                class="form-control" 
                id="Input_data" 
                name="Input_data" 
                rows="6" 
                placeholder="Paste article text here..." 
                required>{% if input_text %}{{ input_text }}{% endif %}</textarea>
        </div>
        
        <button type="submit" class="btn btn-primary w-100 btn-custom">Analyze Content</button>
    </form>

    <!-- EXCLUSIVE SINGLE ALERT OUTPUT -->
    {% if prediction %}
        <div class="alert alert-{{ alert_class }} alert-box" role="alert">
            {{ prediction }}
        </div>
    {% endif %}
</div>

</body>
</html>
