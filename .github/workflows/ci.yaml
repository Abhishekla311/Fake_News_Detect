name: Production MLOps Engine CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  code-quality-and-pipeline-test:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository Source
        uses: actions/checkout@v4

      - name: Initialize Python 3.11 Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Bootstrap Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest boto3 pandas scikit-learn redis nltk joblib mlflow alibi-detect prometheus-client fastapi uvicorn python-dotenv psycopg2-binary sqlalchemy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Code Quality Syntax Linting
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      # AWS US-EAST-1 कीज़ और ऑटो-ट्रिम सेफ्टी नेट के साथ डेटा इनजेशन टेस्ट रन करना
      - name: Run Data Ingestion Validation
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          AWS_DEFAULT_REGION: "us-east-1"
          PYTHONPATH: .
        run: |
          CLEAN_AWS_ID=$(echo -n "$AWS_ACCESS_KEY_ID" | tr -d '\r\n ')
          CLEAN_AWS_SECRET=$(echo -n "$AWS_SECRET_ACCESS_KEY" | tr -d '\r\n ')
          AWS_ACCESS_KEY_ID=$CLEAN_AWS_ID AWS_SECRET_ACCESS_KEY=$CLEAN_AWS_SECRET python src/data_ingestion/data_ingestion.py

      # 🌟 फ़िक्स: यहाँ सही डाउनलोड लिंक 'install.astronomer.io' का उपयोग किया गया है
      - name: Setup Astronomer Engine Framework
        run: |
          curl -sSL https://install.astronomer.io | sudo bash

      - name: Validate DAG Integrity (Parse Check)
        run: |
          astro dev parse

  containerization-and-delivery:
    needs: code-quality-and-pipeline-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repository Source
        uses: actions/checkout@v4

      # 1. AWS Credentials कॉन्फ़िगर करें (ECR और EKS एक्सेस के लिए)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{secrets.AWS_ACCESS_KEY_ID}}
          aws-secret-access-key: ${{secrets.AWS_SECRET_ACCESS_KEY}}
          aws-region: us-east-1

      # 2. Amazon ECR में लॉगिन करें
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. ऑटो-क्रिएट सुरक्षा कवच: यह आपके अकाउंट में 'fake-news-mlops' रिपॉजिटरी खुद बना देगा
      - name: Auto Create ECR Repository if missing
        run: |
          aws ecr describe-repositories --repository-names fake-news-mlops --region us-east-1 || \
          aws ecr create-repository --repository-name fake-news-mlops --region us-east-1

      - name: Configure Advanced Build Tools (Buildx)
        uses: docker/setup-buildx-action@v3

      # 4. Docker Image बिल्ड करके AWS ECR में पुश करें
      - name: Build and Push Immutable Container to AWS ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{steps.login-ecr.outputs.registry}}/fake-news-mlops:latest
            ${{steps.login-ecr.outputs.registry}}/fake-news-mlops:${{github.sha}}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 5. k8s फ़ोल्डर के अंदर मौजूद पैरामेटर्स को असली Secrets (Base64 कनवर्टेड) से बदलना
      # 5. k8s-deployment.yaml फ़ाइल के अंदर मौजूद प्लेसहोल्डर्स को असली Secrets से बदलना
      - name: Inject Secure Base64 Secrets to K8s Manifest
        run: |
          B64_AWS_ID=$(echo -n "${{secrets.AWS_ACCESS_KEY_ID}}" | base64 -w 0)
          B64_AWS_SECRET=$(echo -n "${{secrets.AWS_SECRET_ACCESS_KEY}}" | base64 -w 0)
          B64_CAPSTONE=$(echo -n "${{secrets.CAPSTONE_TEST}}" | base64 -w 0)
          
          # 🌟 फ़िक्स: यहाँ 'k8s/k8s-deployment.yaml' से 'k8s/' हटाकर डायरेक्ट फ़ाइल नाम दिया गया है
          sed -i "s/AWS_ACCESS_KEY_ID_PLACEHOLDER/$B64_AWS_ID/g" k8s-deployment.yaml
          sed -i "s/AWS_SECRET_ACCESS_KEY_PLACEHOLDER/$B64_AWS_SECRET/g" k8s-deployment.yaml
          sed -i "s/CAPSTONE_TEST_PLACEHOLDER/$B64_CAPSTONE/g" k8s-deployment.yaml

      # 6. मैनिफेस्ट को सीधे अमेज़न EKS क्लस्टर पर अप्लाई करना
      - name: Deploy Manifests to Amazon EKS Cluster
        run: |
          # 🛑 YOUR_EKS_CLUSTER_NAME_HERE को अपने असली AWS EKS क्लस्टर नेम से बदलें
          aws eks update-kubeconfig --region us-east-1 --name fake-news-mlops
          # 🌟 फ़िक्स: यहाँ भी 'k8s/' हटा दिया गया है
          kubectl apply -f k8s-deployment.yaml