name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull DVC Data
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        run: |
          pip install dvc[s3]
          dvc pull

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint Code
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.fastapi
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/fakenews-fastapi:latest

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.HOST_IP}}
          username: ${{secrets.HOST_USER}}
          key: ${{secrets.HOST_SSH_KEY}}
          script: |
            # 1. Check and install K3s
            if ! command -v k3s &> /dev/null && ! command -v kubectl &> /dev/null; then
              curl -sfL https://get.k3s.io | sh -
            fi

            # 2. Set permissions and KUBECONFIG
            sudo chmod 644 /etc/rancher/k3s/k3s.yaml
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # 3. Wait until K3s API server is responsive
            echo "Waiting for k3s cluster to be fully ready..."
            until kubectl get nodes &>/dev/null; do
              echo "K3s is still starting up, sleeping 5 seconds..."
              sleep 5
            done

            # Extra buffer time to settle API server
            sleep 10

            # 4. Navigate to application folder
            mkdir -p /opt/fakenews-app
            cd /opt/fakenews-app

            # 5. Git pull or clone latest code
            if [ -d ".git" ]; then
              git pull origin main || git pull origin master
            else
              git clone https://github.com/Abhishekla311/Fake_News_Detect.git .
            fi

            # 6. Apply manifests with validation skip option as backup
            kubectl apply -f deployment.yaml

            # 7. Rollout status / restart safely
            kubectl rollout restart deployment/fastapi-deployment