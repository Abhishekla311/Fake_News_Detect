name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull DVC Data
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        run: |
          pip install dvc[s3]
          dvc pull

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint Code
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.fastapi
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/fakenews-fastapi:latest

      # 1. ensure directory exists on EC2 before SCP
      - name: Create Target Directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.HOST_IP}}
          username: ${{secrets.HOST_USER}}
          key: ${{secrets.HOST_SSH_KEY}}
          script: |
            sudo mkdir -p /opt/fakenews-app
            sudo chown -R ${{secrets.HOST_USER}}:${{secrets.HOST_USER}} /opt/fakenews-app

      # 2. Copy manifest files directly
      - name: Copy deployment files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{secrets.HOST_IP}}
          username: ${{secrets.HOST_USER}}
          key: ${{secrets.HOST_SSH_KEY}}
          source: "*.yaml"
          target: "/opt/fakenews-app/"

      # 3. Install k3s, Wait for API Server, and Deploy
      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.HOST_IP}}
          username: ${{secrets.HOST_USER}}
          key: ${{secrets.HOST_SSH_KEY}}
          script: |
            export DEBIAN_FRONTEND=noninteractive
            if ! command -v k3s &> /dev/null && ! command -v kubectl &> /dev/null; then
              curl -sfL https://get.k3s.io | sh -
            fi

            sudo chmod 644 /etc/rancher/k3s/k3s.yaml
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # Wait loop to avoid API Server TLS timeout hanging
            echo "Waiting for k3s cluster readiness..."
            until kubectl get nodes &>/dev/null; do
              sleep 3
            done

            cd /opt/fakenews-app
            kubectl apply -f deployment.yaml
            kubectl rollout restart deployment/fastapi-deployment || true