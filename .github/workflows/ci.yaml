name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pull DVC Data
        env:
          AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
          AWS_SECRET_ACCESS_KEY: ${{secrets.AWS_SECRET_ACCESS_KEY}}
        run: |
          pip install dvc[s3]
          dvc pull

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 pytest

      - name: Lint Code
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-deploy:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and Push FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.fastapi
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/fakenews-fastapi:latest

      # SCP हटा दिया गया है, डायरेक्ट single SSH step:
      - name: Deploy to Kubernetes via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{secrets.HOST_IP}}
          username: ${{secrets.HOST_USER}}
          key: ${{secrets.HOST_SSH_KEY}}
          script: |
            export DEBIAN_FRONTEND=noninteractive
            
            # 1. K3s setup
            if ! command -v k3s &> /dev/null; then
              curl -sfL https://get.k3s.io | sh -
            fi
            sudo chmod 644 /etc/rancher/k3s/k3s.yaml
            export KUBECONFIG=/etc/rancher/k3s/k3s.yaml

            # 2. Wait for k3s readiness
            until kubectl get nodes &>/dev/null; do
              sleep 2
            done

            # 3. Download and Apply deployment.yaml directly from GitHub
            kubectl apply -f https://raw.githubusercontent.com/Abhishekla311/Fake_News_Detect/main/deployment.yaml
            kubectl rollout restart deployment/fastapi-deployment || true